# Local run with the web UI: docker compose up --build, then open http://localhost:8081
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: pg
      POSTGRES_DB: koya
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 30
  app:
    build: .
    ports:
      - "8081:8080"
    environment:
      DATABASE_URL: postgres://postgres:pg@db:5432/koya
      API_KEY: dev
    depends_on:
      db:
        condition: service_healthy
