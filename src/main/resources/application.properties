spring.application.name=koya-booking-api
server.port=${PORT:8080}
server.shutdown=graceful
server.error.whitelabel.enabled=false
spring.main.banner-mode=off

# Set from the environment: DATABASE_URL (postgres://user:pass@host:port/db or jdbc:postgresql://...) and API_KEY.
app.database-url=${DATABASE_URL:}
app.api-key=${API_KEY:dev}

# Schema: created from schema.sql on every start (all statements are IF NOT EXISTS).
# Hibernate does not generate tables: JPA can't express the partial unique index that backs level 3.
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
