<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clinic Booking</title>
<style>
  :root {
    --bg: #f5f4fb; --card: #fff; --text: #1e1b2e; --muted: #625d78; --line: #e4e1f0;
    --accent: #5b3fd6; --accent-ink: #fff; --accent-soft: #eeeafd;
    --danger: #c0262d; --danger-soft: #fdebec; --ok-soft: #e8f5ee; --ok: #17663a;
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12101c; --card: #1b1828; --text: #ebe8f5; --muted: #a39dbb; --line: #2e2a40;
      --accent: #a594ff; --accent-ink: #1a1240; --accent-soft: #2a2350;
      --danger: #ff7b80; --danger-soft: #3d1619; --ok-soft: #13301f; --ok: #72e3a2;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { padding: 28px 16px 8px; max-width: 960px; margin: 0 auto; }
  header h1 { margin: 0; font-size: 26px; letter-spacing: -0.01em; }
  header p { margin: 4px 0 0; color: var(--muted); }
  main { max-width: 960px; margin: 0 auto; padding: 8px 16px 48px; display: grid; gap: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
  .card h2 { margin: 0 0 12px; font-size: 17px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  input, select { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line);
                  border-radius: 8px; padding: 9px 11px; min-width: 0; }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 8px; padding: 9px 14px; cursor: pointer;
           background: var(--accent); color: var(--accent-ink); }
  button.secondary { background: transparent; color: var(--text); border: 1px solid var(--line); }
  button.danger { background: var(--danger-soft); color: var(--danger); }
  button:disabled { opacity: .55; cursor: default; }
  .day { margin-top: 14px; }
  .day h3 { margin: 0 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .slot { text-align: left; background: var(--accent-soft); color: var(--text); border: 1px solid transparent;
          padding: 10px 12px; border-radius: 10px; font-weight: 500; }
  .slot b { display: block; font-size: 15px; }
  .slot span { font-size: 13px; color: var(--muted); }
  .slot.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .slot:disabled { background: var(--bg); opacity: 1; text-decoration: line-through; color: var(--muted); }
  .msg { padding: 10px 12px; border-radius: 8px; margin-top: 12px; }
  .msg.error { background: var(--danger-soft); color: var(--danger); }
  .msg.ok { background: var(--ok-soft); color: var(--ok); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid2 input { width: 100%; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0; }
  dt { color: var(--muted); } dd { margin: 0; word-break: break-all; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 12px; font-weight: 600; }
  .pill.confirmed { background: var(--ok-soft); color: var(--ok); }
  .pill.cancelled { background: var(--danger-soft); color: var(--danger); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; }
  .muted { color: var(--muted); }
  .hidden { display: none; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .scroll { overflow-x: auto; }
  @media (max-width: 680px) { .grid2, .two { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>Clinic Booking</h1>
  <p>Pick an open slot, enter your details, and you're booked.</p>
</header>
<main>
  <section class="card">
    <div class="row" style="justify-content: space-between">
      <h2 style="margin:0">Available slots</h2>
      <div class="row">
        <select id="provider" aria-label="Filter by provider"><option value="">All providers</option></select>
        <button class="secondary" id="refresh">Refresh</button>
      </div>
    </div>
    <div id="slots"><p class="muted">Loading…</p></div>
    <div id="slotsMsg"></div>
  </section>

  <section class="card hidden" id="bookCard">
    <h2>Book <span id="bookWhat"></span></h2>
    <form id="bookForm" novalidate>
      <div class="grid2">
        <div><label for="name">Full name</label><input id="name" autocomplete="name" required></div>
        <div><label for="email">Email</label><input id="email" type="email" autocomplete="email" required></div>
      </div>
      <div class="row" style="margin-top:12px">
        <button type="submit" id="bookBtn">Confirm booking</button>
        <button type="button" class="secondary" id="bookCancel">Cancel</button>
      </div>
    </form>
    <div id="bookMsg"></div>
  </section>

  <section class="card hidden" id="confirmCard">
    <h2>Booking <span id="confStatus"></span></h2>
    <dl id="confDetails"></dl>
    <div class="row" style="margin-top:14px">
      <button class="danger" id="cancelBtn">Cancel this booking</button>
    </div>
    <div id="confMsg"></div>
  </section>

  <div class="two">
    <section class="card">
      <h2>My bookings</h2>
      <form id="mineForm" class="row">
        <input id="mineEmail" type="email" placeholder="you@example.com" aria-label="Email" style="flex:1">
        <button type="submit">Show</button>
      </form>
      <div id="mine"></div>
    </section>
    <section class="card">
      <h2>Find a booking</h2>
      <form id="findForm" class="row">
        <input id="findId" placeholder="Booking ID" aria-label="Booking ID" style="flex:1">
        <button type="submit">Look up</button>
      </form>
      <div id="findMsg"></div>
    </section>
  </div>
</main>

<script>
const API = '/web/api';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDay = (iso) => new Date(iso).toLocaleDateString(undefined, {weekday:'short', day:'numeric', month:'short', year:'numeric'});
const fmtTime = (iso) => new Date(iso).toLocaleTimeString(undefined, {hour:'2-digit', minute:'2-digit'});
const fmtFull = (iso) => fmtDay(iso) + ', ' + fmtTime(iso);
const msg = (el, text, kind = 'error') => { el.innerHTML = text ? `<div class="msg ${kind}">${esc(text)}</div>` : ''; };

async function call(method, path, body, headers = {}) {
  const opts = {method, headers: {...headers}};
  if (body !== undefined) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  let res;
  try { res = await fetch(API + path, opts); }
  catch { throw new Error('Network error. Check your connection and try again.'); }
  let data = null;
  try { data = await res.json(); } catch {}
  if (!res.ok) {
    let text = (data && data.error) || `Request failed (${res.status})`;
    if (res.status === 429) text += ` Try again in ${res.headers.get('Retry-After') || 'a few'} seconds.`;
    const err = new Error(text); err.status = res.status; throw err;
  }
  return data;
}

let allSlots = [], slotsById = {}, selected = null, idemKey = null, current = null;

async function loadSlots() {
  try {
    const data = await call('GET', '/slots');
    allSlots = data.slots;
    slotsById = Object.fromEntries(allSlots.map(s => [s.id, s]));
    const sel = $('provider'), keep = sel.value;
    const providers = [...new Set(allSlots.map(s => s.provider))].sort();
    sel.innerHTML = '<option value="">All providers</option>' +
      providers.map(p => `<option${p === keep ? ' selected' : ''}>${esc(p)}</option>`).join('');
    renderSlots();
    msg($('slotsMsg'), '');
  } catch (e) { msg($('slotsMsg'), e.message); }
}

function renderSlots() {
  const p = $('provider').value, now = Date.now();
  const list = allSlots.filter(s => (!p || s.provider === p) && new Date(s.start).getTime() > now);
  if (!list.length) { $('slots').innerHTML = '<p class="muted">No upcoming slots.</p>'; return; }
  const days = {};
  for (const s of list) (days[fmtDay(s.start)] ||= []).push(s);
  $('slots').innerHTML = Object.entries(days).map(([day, ss]) => `
    <div class="day"><h3>${esc(day)}</h3><div class="slots">
      ${ss.map(s => `<button class="slot${selected === s.id ? ' selected' : ''}" data-id="${esc(s.id)}"
          ${s.available ? '' : 'disabled title="Already booked"'}>
          <b>${esc(fmtTime(s.start))} – ${esc(fmtTime(s.end))}</b><span>${esc(s.provider)}${s.available ? '' : ' · booked'}</span>
        </button>`).join('')}
    </div></div>`).join('');
}

$('slots').addEventListener('click', (e) => {
  const btn = e.target.closest('.slot'); if (!btn || btn.disabled) return;
  selected = btn.dataset.id; idemKey = null;
  const s = slotsById[selected];
  $('bookWhat').textContent = `${s.provider} · ${fmtFull(s.start)}`;
  $('bookCard').classList.remove('hidden'); msg($('bookMsg'), '');
  renderSlots(); $('name').focus();
});
$('provider').addEventListener('change', renderSlots);
$('refresh').addEventListener('click', loadSlots);
$('bookCancel').addEventListener('click', () => { selected = null; $('bookCard').classList.add('hidden'); renderSlots(); });

// Any change to the details makes it a different request, so it needs a new key.
for (const id of ['name', 'email']) $(id).addEventListener('input', () => { idemKey = null; });

$('bookForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = $('name').value.trim(), email = $('email').value.trim();
  if (!name || !email) return msg($('bookMsg'), 'Please enter your name and email.');
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return msg($('bookMsg'), 'Please enter a valid email address.');
  // Reusing the key on retry means a double click or a flaky network can't double-book.
  idemKey ||= (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now());
  $('bookBtn').disabled = true;
  try {
    const b = await call('POST', '/bookings', {slot_id: selected, name, email}, {'Idempotency-Key': idemKey});
    idemKey = null; selected = null;
    $('bookCard').classList.add('hidden');
    showBooking(b, 'Your booking is confirmed.');
    $('mineEmail').value = b.email;
    loadSlots();
  } catch (err) {
    msg($('bookMsg'), err.message);
    if (err.status === 409) { idemKey = null; loadSlots(); }
  } finally { $('bookBtn').disabled = false; }
});

function showBooking(b, note) {
  current = b;
  const s = slotsById[b.slot_id];
  $('confStatus').innerHTML = `<span class="pill ${esc(b.status)}">${esc(b.status)}</span>`;
  $('confDetails').innerHTML = `
    <dt>Booking ID</dt><dd><code>${esc(b.id)}</code></dd>
    <dt>Name</dt><dd>${esc(b.name)}</dd>
    <dt>Email</dt><dd>${esc(b.email)}</dd>
    <dt>Appointment</dt><dd>${s ? esc(`${s.provider} · ${fmtFull(s.start)} – ${fmtTime(s.end)}`) : esc(b.slot_id)}</dd>
    <dt>Booked at</dt><dd>${esc(fmtFull(b.created_at))}</dd>`;
  $('cancelBtn').classList.toggle('hidden', b.status !== 'confirmed');
  msg($('confMsg'), note || '', 'ok');
  $('confirmCard').classList.remove('hidden');
  $('confirmCard').scrollIntoView({behavior: 'smooth', block: 'nearest'});
}

$('cancelBtn').addEventListener('click', async () => {
  if (!current || !confirm('Cancel this booking?')) return;
  try {
    const b = await call('DELETE', '/bookings/' + encodeURIComponent(current.id));
    showBooking(b, 'Booking cancelled. The slot is open again.');
    loadSlots();
  } catch (e) { msg($('confMsg'), e.message); }
});

$('findForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const id = $('findId').value.trim(); if (!id) return;
  try { showBooking(await call('GET', '/bookings/' + encodeURIComponent(id))); msg($('findMsg'), ''); }
  catch (err) { msg($('findMsg'), err.message); }
});

let mineCursor = null, mineEmail = '';
async function loadMine(append) {
  try {
    const q = new URLSearchParams({email: mineEmail, limit: '5'});
    if (append && mineCursor) q.set('cursor', mineCursor);
    const data = await call('GET', '/bookings?' + q);
    mineCursor = data.next_cursor;
    const rows = data.bookings.map(b => {
      const s = slotsById[b.slot_id];
      return `<tr><td>${s ? esc(s.provider + ' · ' + fmtFull(s.start)) : esc(b.slot_id)}</td>
        <td><span class="pill ${esc(b.status)}">${esc(b.status)}</span></td>
        <td><button class="secondary" data-id="${esc(b.id)}">View</button></td></tr>`;
    }).join('');
    const tbody = $('mineBody');
    if (append && tbody) tbody.insertAdjacentHTML('beforeend', rows);
    else $('mine').innerHTML = data.bookings.length
      ? `<div class="scroll" style="margin-top:12px"><table><thead><tr><th>Appointment</th><th>Status</th><th></th></tr></thead>
         <tbody id="mineBody">${rows}</tbody></table></div><div id="mineMore"></div>`
      : '<p class="muted">No bookings for that email.</p>';
    const more = $('mineMore');
    if (more) more.innerHTML = mineCursor ? '<button class="secondary" id="moreBtn" style="margin-top:10px">Load more</button>' : '';
  } catch (e) { msg($('mine'), e.message); }
}
$('mineForm').addEventListener('submit', (e) => {
  e.preventDefault(); mineEmail = $('mineEmail').value.trim(); mineCursor = null;
  if (mineEmail) loadMine(false);
});
$('mine').addEventListener('click', async (e) => {
  if (e.target.id === 'moreBtn') return loadMine(true);
  const id = e.target.dataset && e.target.dataset.id;
  if (id) { try { showBooking(await call('GET', '/bookings/' + encodeURIComponent(id))); } catch (err) { msg($('mine'), err.message); } }
});

loadSlots();
</script>
</body>
</html>
