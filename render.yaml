databases:
  - name: koya-booking-java-db
    plan: free
    databaseName: koya
    user: koya

services:
  - type: web
    name: koya-booking-api-java
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: koya-booking-java-db
          property: connectionString
      - key: API_KEY
        generateValue: true
